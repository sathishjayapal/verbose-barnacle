# Standalone DB compose for verbose-barnacle (my-github-cleaner) — values match the
# `github-cleaner-db` service that consolidated-postgres/scripts/vm/vm-db-up.sh generates
# (see scripts/lib/project-config.sh).
#   docker compose up -d
services:
  postgres:
    container_name: github-cleaner-db
    image: postgres:16.15
    environment:
      - POSTGRES_DB=${GITHUB_CLEANER_DB_NAME:-my-github-cleaner}
      - POSTGRES_USER=${GITHUB_CLEANER_DB_USER:?set in .env (see .env.example)}
      - POSTGRES_PASSWORD=${GITHUB_CLEANER_DB_PASSWORD:?set in .env (see .env.example)}
    ports:
      - 5439:5432
    volumes:
      - github_cleaner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${GITHUB_CLEANER_DB_USER} -d ${GITHUB_CLEANER_DB_NAME:-my-github-cleaner}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  github_cleaner_pg_data:
