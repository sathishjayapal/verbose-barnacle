# .github/workflows/ci-cd.yml
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      # -Dmaven.compiler.proc=full: JDK 24 no longer runs Lombok's annotation
      # processor implicitly. Integration tests use Testcontainers, which works
      # on the GitHub-hosted runners' Docker daemon.
      - name: Run tests with coverage
        run: mvn verify -B -Dmaven.compiler.proc=full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Select image tag
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"

      # Build only (no push) — validates the image builds and warms the cache
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Select image tag
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"

      # Build locally for scanning — shares the gha cache with the build job
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL severity only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${GITHUB_WORKSPACE}/.trivyignore:/.trivyignore:ro \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile /.trivyignore \
            ${{ steps.image.outputs.tag }}

      - name: Trivy vulnerability report (all severities for transparency)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --format table \
            --ignore-unfixed \
            ${{ steps.image.outputs.tag }} || true

  publish:
    needs: [ build, scan ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record GitHub Deployment
        if: github.ref == 'refs/heads/main'
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: staging
          description: ${{ steps.meta.outputs.tags }}

      - name: Mark deployment successful
        if: github.ref == 'refs/heads/main'
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
